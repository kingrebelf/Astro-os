[window]
padding = { x = 12, y = 10 }
dynamic_padding = true
title = "ASTRO//TERM"
dimensions = { columns = 100, lines = 30 }

[font]
size = 12.5
normal = { family = "Ubuntu Mono", style = "Regular" }
bold = { family = "Ubuntu Mono", style = "Bold" }

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 520

[colors.primary]
background = "#010705"
foreground = "#7dffc0"
bright_foreground = "#dcfff0"

[colors.cursor]
cursor = "#00ff8c"
text = "#000000"

[colors.selection]
background = "#00ff8c"
text = "#000000"

[colors.normal]
black = "#02120c"
red = "#ff2bd6"
green = "#00ff8c"
yellow = "#ffbe3c"
blue = "#00a8ff"
magenta = "#c77dff"
cyan = "#00e5ff"
white = "#a8e6c8"

[colors.bright]
black = "#1f7350"
red = "#ff6be3"
green = "#6dffb8"
yellow = "#ffd77a"
blue = "#5cc8ff"
magenta = "#dda8ff"
cyan = "#7df3ff"
white = "#eafff5"
