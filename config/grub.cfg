# Boot menu of the ASTRO//OS USB stick / ISO.
search --no-floppy --set=root --file /.astro-os-live
set timeout=3
set default=0
set menu_color_normal=light-green/black
set menu_color_highlight=black/light-green
set color_normal=light-green/black

# only the live-config steps this system needs (the full set costs about 8 seconds of boot)
set live="boot=live live-config.components=hostname,user-setup,sudo,lightdm quiet loglevel=3 username=astro hostname=astro-os user-fullname=Astro"

menuentry "ASTRO//OS @VERSION@   start (try it, then install from the dock)" {
  linux /live/vmlinuz $live
  initrd /live/initrd.img
}
menuentry "ASTRO//OS   safe graphics (if the screen stays black)" {
  linux /live/vmlinuz $live nomodeset
  initrd /live/initrd.img
}
menuentry "ASTRO//OS   run from memory (the USB stick can be removed)" {
  linux /live/vmlinuz $live toram
  initrd /live/initrd.img
}
menuentry "Boot from the first hard disk" {
  if [ "$grub_platform" = "efi" ]; then exit; else set root=(hd1); chainloader +1; fi
}
