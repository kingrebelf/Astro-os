# Runs inside the freshly installed system: take the live-USB machinery and the installer back out.
---
dontChroot: false
timeout: 900
script:
- command: "DEBIAN_FRONTEND=noninteractive apt-get -y purge calamares live-boot live-boot-initramfs-tools live-config live-config-systemd user-setup"
  timeout: 600
- command: "DEBIAN_FRONTEND=noninteractive apt-get -y autoremove --purge"
  timeout: 600
- "rm -rf /etc/calamares /usr/local/bin/astro-install"
