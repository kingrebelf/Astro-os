---
defaultGroups: [ cdrom, floppy, sudo, audio, dip, video, plugdev, netdev, users ]
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
# on by default: the machine boots straight to the desktop
doAutologin: true
passwordRequirements:
  minLength: 1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /bin/bash
  forbidden_names: [ root ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "astro-${cpu}"
  forbidden_names: [ localhost ]
